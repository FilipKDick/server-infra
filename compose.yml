services:
  caddy:
    image: caddy:2-alpine
    container_name: server_infra_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
    networks:
      - caddy-shared

  umami_postgres:
    image: postgres:17
    container_name: server_infra_umami_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${UMAMI_POSTGRES_DB}
      POSTGRES_USER: ${UMAMI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD}
    volumes:
      - umami_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_POSTGRES_USER} -d ${UMAMI_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: server_infra_umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${UMAMI_POSTGRES_USER}:${UMAMI_POSTGRES_PASSWORD}@umami_postgres:5432/${UMAMI_POSTGRES_DB}
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      umami_postgres:
        condition: service_healthy
    networks:
      - caddy-shared
      - default

  beszel:
    image: henrygd/beszel:latest
    container_name: server_infra_beszel
    restart: unless-stopped
    environment:
      APP_URL: ${BESZEL_APP_URL}
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    networks:
      - caddy-shared

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: server_infra_beszel_agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      TOKEN: ${BESZEL_AGENT_TOKEN}
      KEY: ${BESZEL_AGENT_KEY}

volumes:
  caddy_data:
  caddy_config:
  umami_postgres_data:

networks:
  caddy-shared:
    external: true
